<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayün Ecorefugio - Guía de Huéspedes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/fVjKQKD4/rayunrender.png">
    <style>
        #map { height: 400px; width: 100%; border-radius: 0.75rem; z-index: 1; }
        
        /* Animación del GPS */
        .user-pulse {
            background-color: #3b82f6; width: 16px; height: 16px; border-radius: 50%;
            border: 3px solid white; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* Estilo para los textos flotantes con transición inteligente */
        .map-text-label {
            background: transparent;
            border: none;
            box-shadow: none;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 1px 1px 3px #000, -1px -1px 3px #000, 1px -1px 3px #000, -1px 1px 3px #000;
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s ease, font-size 0.3s ease;
        }
    </style>
</head>
<body class="bg-[#f4f1ea] text-gray-800 pb-12 font-sans">

    <!-- Navegación Rayün -->
    <nav class="bg-[#2c4c3b] text-[#e8ecd7] p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">🌲 Rayün Ecorefugio</h1>
        <div>
            <button id="btnLogin" class="bg-[#1f362a] px-4 py-2 rounded-lg hover:bg-[#15251d] text-sm font-semibold transition">Admin</button>
            <button id="btnLogout" class="hidden bg-red-700 px-4 py-2 rounded-lg hover:bg-red-600 text-sm font-semibold transition">Salir</button>
        </div>
    </nav>

    <!-- Banner Huéspedess -->
    <header class="text-center py-6 px-4 bg-white shadow-sm border-b border-[#e5e0d8]">
        <h2 class="text-2xl font-bold text-[#2c4c3b] mb-2">Bienvenido a tu entorno</h2>
        <p class="text-gray-600 text-sm max-w-xl mx-auto">Explora los puntos de interés cercanos a tu cabaña. Selecciona un lugar en la lista para trazar la ruta en el mapa.</p>
    </header>

    <div id="locationStatus" class="bg-blue-50 text-blue-800 p-2 text-center text-sm font-semibold border-b border-blue-100">
        📡 Buscando señal GPS para guiarte...
    </div>

    <div class="max-w-6xl mx-auto p-4 space-y-6">

        <!-- Mapa -->
        <section class="bg-white p-2 rounded-xl shadow-md border border-[#e5e0d8]">
            <div id="map"></div>
        </section>

        <!-- Filtros Dinámicos -->
        <section id="filterContainer" class="flex flex-wrap gap-2 justify-center items-center bg-white p-4 rounded-xl shadow-sm border border-[#e5e0d8]">
            <span class="text-sm font-bold text-gray-500 mr-2">Explorar:</span>
        </section>

        <!-- Panel de Administrador -->
        <div id="adminPanel" class="hidden bg-white p-6 rounded-xl shadow-lg border-l-4 border-[#2c4c3b] grid md:grid-cols-3 gap-8">
            
            <!-- Formulario Puntos -->
            <div class="md:col-span-2">
                <h2 id="formTitle" class="text-xl font-bold mb-4 text-[#2c4c3b]">📍 Agregar Punto a la Guía</h2>
                <form id="placeForm" class="space-y-4">
                    <input type="hidden" id="editPlaceId" value="">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="placeName" placeholder="Nombre del destino" class="p-2 bg-gray-50 border rounded w-full" required>
                        <select id="placeCategory" class="p-2 bg-gray-50 border rounded w-full" required></select>
                    </div>
                    <textarea id="placeDesc" placeholder="Descripción para los huéspedes" class="w-full p-2 bg-gray-50 border rounded" required></textarea>
                    <input type="url" id="placeImage" placeholder="URL directa de la imagen" class="w-full p-2 bg-gray-50 border rounded" required>
                    <div class="flex gap-4">
                        <input type="number" id="placeLat" step="any" placeholder="Latitud" class="w-1/2 p-2 bg-gray-50 border rounded" required>
                        <input type="number" id="placeLng" step="any" placeholder="Longitud" class="w-1/2 p-2 bg-gray-50 border rounded" required>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="btnSubmitForm" class="bg-[#2c4c3b] text-white px-4 py-2 rounded w-full font-bold hover:bg-[#1f362a]">Publicar Destino</button>
                        <button type="button" id="btnCancelEdit" class="hidden bg-gray-500 text-white px-4 py-2 rounded font-bold">Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Gestión de Categorías y Textos -->
            <div class="border-t md:border-t-0 md:border-l border-gray-200 pt-6 md:pt-0 md:pl-6 flex flex-col gap-6">
                <div>
                    <h2 class="text-lg font-bold mb-2 text-[#2c4c3b]">🏷️ Categorías</h2>
                    <form id="catForm" class="flex gap-2 mb-2">
                        <input type="text" id="catName" placeholder="Nueva categoría" class="p-2 bg-gray-50 border rounded w-full text-sm" required>
                        <button type="submit" class="bg-[#2c4c3b] text-white px-3 py-2 rounded font-bold text-sm">+</button>
                    </form>
                    <ul id="adminCatList" class="space-y-1 text-sm max-h-32 overflow-y-auto pr-2"></ul>
                </div>

                <div class="border-t pt-4 border-gray-200">
                    <h2 class="text-lg font-bold mb-2 text-[#2c4c3b]">🔤 Textos en el Mapa</h2>
                    <form id="labelForm" class="flex flex-col gap-2 mb-2">
                        <input type="text" id="labelText" placeholder="Ej: Río San Pedro" class="p-2 bg-gray-50 border rounded w-full text-sm" required>
                        <div class="flex gap-2">
                            <input type="number" id="labelLat" step="any" placeholder="Lat" class="p-2 bg-gray-50 border rounded w-1/2 text-sm" required>
                            <input type="number" id="labelLng" step="any" placeholder="Lng" class="p-2 bg-gray-50 border rounded w-1/2 text-sm" required>
                        </div>
                        <button type="submit" class="bg-blue-600 text-white px-3 py-2 rounded font-bold text-sm hover:bg-blue-700">Pintar Texto</button>
                    </form>
                    <ul id="adminLabelList" class="space-y-1 text-sm max-h-32 overflow-y-auto pr-2"></ul>
                </div>
            </div>
        </div>

        <main id="placesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        // TUS CREDENCIALES EXACTAS
        const firebaseConfig = {
            apiKey: "AIzaSyBqZOhs1PmGO0hfO-9g0q3k5exw8KkxpzM",
            authDomain: "turismo-los-lagos.firebaseapp.com",
            projectId: "turismo-los-lagos",
            storageBucket: "turismo-los-lagos.firebasestorage.app",
            messagingSenderId: "355598310347",
            appId: "1:355598310347:web:11bcb226c8d50c619e344e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let userLocation = null;
        let isAdmin = false;
        let allPlaces = [];
        let allCategories = [];
        let currentFilter = 'Todas';
        
        let map, userMarker, routeLayer;
        let mapMarkers = [];
        let labelMarkers = [];

        // VARIABLES PARA NAVEGACIÓN ACTIVA Y LLEGADA A DESTINO
        let currentDestination = null;
        let lastRouteCalcLocation = null;
        let isFirstRouteDraw = true;
        let arrivalTimer = null;
        let isAtDestination = false;

        const limitesLosRios = [
            [-40.80, -74.00], 
            [-39.20, -71.50]  
        ];

        map = L.map('map', {
            maxBounds: limitesLosRios,
            maxBoundsViscosity: 1.0, 
            minZoom: 8
        }).setView([-39.85, -72.82], 10); 

        // 1. Imagen satelital de fondo
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri'
        }).addTo(map);

        // 2. Trazado automático de calles y carreteras
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}').addTo(map);

        // 3. Nombres de lugares, ríos y fronteras
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}').addTo(map);

        // FUNCIÓN: Ajustar tamaño y visibilidad de textos según el zoom
        function adjustLabelsByZoom() {
            const currentZoom = map.getZoom();
            const labels = document.querySelectorAll('.map-text-label');
            labels.forEach(label => {
                if (currentZoom < 11) {
                    label.style.opacity = '0';
                } else if (currentZoom === 11) {
                    label.style.opacity = '1';
                    label.style.fontSize = '9px';
                } else if (currentZoom === 12) {
                    label.style.opacity = '1';
                    label.style.fontSize = '12px';
                } else {
                    label.style.opacity = '1';
                    label.style.fontSize = '15px';
                }
            });
        }
        map.on('zoomend', adjustLabelsByZoom);

        // GPS: Seguimiento, Recalculación y Llegada
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                    
                    if (!currentDestination) {
                        document.getElementById('locationStatus').innerText = "📍 Ubicación conectada (Modo Libre).";
                        document.getElementById('locationStatus').className = "bg-blue-50 text-blue-800 p-2 text-center text-sm font-semibold border-b border-blue-100";
                    } else {
                        document.getElementById('locationStatus').innerText = "📍 Navegación activa. El mapa te está siguiendo.";
                        document.getElementById('locationStatus').className = "bg-green-50 text-green-800 p-2 text-center text-sm font-semibold border-b border-green-100";
                    }
                    
                    if(userMarker) {
                        userMarker.setLatLng([userLocation.lat, userLocation.lng]);
                        // LA CÁMARA SOLO SIGUE AL USUARIO SI HAY UNA RUTA TRAZADA
                        if (currentDestination) {
                            map.panTo([userLocation.lat, userLocation.lng], { animate: true });
                        }
                    } else {
                        const userIcon = L.divIcon({ className: 'custom-user-icon', html: '<div class="user-pulse"></div>' });
                        userMarker = L.marker([userLocation.lat, userLocation.lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map)
                            .bindPopup("<b>Tú estás aquí</b>").openPopup();
                        map.setView([userLocation.lat, userLocation.lng], 14);
                    }
                    renderPlaces(); 

                    // SI HAY UNA RUTA ACTIVA: RECALCULAR Y REVISAR TIEMPO EN DESTINO
                    if (currentDestination) {
                        
                        // 1. Verificar si llegó (a menos de 50 metros)
                        const distToDest = map.distance(
                            [userLocation.lat, userLocation.lng],
                            [currentDestination.lat, currentDestination.lng]
                        );

                        if (distToDest < 50) { 
                            if (!isAtDestination) {
                                isAtDestination = true;
                                document.getElementById('locationStatus').innerText = "📍 Has llegado. La ruta se borrará en 5 minutos.";
                                // Inicia el cronómetro de 5 minutos (300,000 milisegundos)
                                arrivalTimer = setTimeout(() => {
                                    if (routeLayer) map.removeLayer(routeLayer);
                                    currentDestination = null;
                                    isAtDestination = false;
                                    lastRouteCalcLocation = null;
                                    document.getElementById('locationStatus').innerText = "✅ Visita completada. Exploración libre reactivada.";
                                }, 300000); 
                            }
                        } else {
                            if (isAtDestination) {
                                // Si se aleja antes de los 5 minutos, se cancela el borrado automático
                                isAtDestination = false;
                                clearTimeout(arrivalTimer);
                            }
                        }

                        // 2. Recalcular la ruta si se movió
                        calculateAndDrawRoute(); 
                    }
                },
                (err) => {
                    document.getElementById('locationStatus').innerText = "⚠️ Activa el GPS para trazar rutas desde tu ubicación.";
                    document.getElementById('locationStatus').className = "bg-yellow-50 text-yellow-800 p-2 text-center text-sm font-semibold";
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        }

        // Trazar Ruta (Iniciado por el usuario)
        window.traceRoute = async function(destLat, destLng) {
            if (!userLocation) return alert("Necesitamos acceso a tu GPS para calcular la ruta.");
            
            // Reiniciar estado de destino
            currentDestination = { lat: destLat, lng: destLng }; 
            isFirstRouteDraw = true;
            lastRouteCalcLocation = null;
            isAtDestination = false;
            if (arrivalTimer) clearTimeout(arrivalTimer);
            
            await calculateAndDrawRoute();
            window.scrollTo({ top: document.getElementById('map').offsetTop - 80, behavior: 'smooth' });
        };

        // Lógica de cálculo y dibujo de ruta
        async function calculateAndDrawRoute() {
            if (!userLocation || !currentDestination) return;

            if (lastRouteCalcLocation) {
                const dist = map.distance(
                    [userLocation.lat, userLocation.lng], 
                    [lastRouteCalcLocation.lat, lastRouteCalcLocation.lng]
                );
                if (dist < 15) return; 
            }
            
            lastRouteCalcLocation = { ...userLocation };

            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${userLocation.lng},${userLocation.lat};${currentDestination.lng},${currentDestination.lat}?geometries=geojson&overview=full`;
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.routes && data.routes.length > 0) {
                    if (routeLayer) map.removeLayer(routeLayer); 
                    
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    routeLayer = L.polyline(coords, { color: '#3b82f6', weight: 6, opacity: 0.9 }).addTo(map);
                    
                    if (isFirstRouteDraw) {
                        map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
                        isFirstRouteDraw = false;
                    }
                }
            } catch (e) {
                console.log("No se pudo recalcular la ruta en este momento.");
            }
        }

        // Auth
        document.getElementById('btnLogin').addEventListener('click', () => {
            const email = prompt("Correo Admin:");
            const password = prompt("Contraseña:");
            if (email && password) signInWithEmailAndPassword(auth, email, password).catch(e => alert("Error: " + e.message));
        });
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            isAdmin = !!user;
            document.getElementById('btnLogin').style.display = user ? 'none' : 'block';
            document.getElementById('btnLogout').style.display = user ? 'block' : 'none';
            document.getElementById('adminPanel').style.display = user ? 'grid' : 'none';
            renderPlaces();
            renderCategories();
            renderLabels();
        });

        // ---------------- TEXTOS EN EL MAPA (ETIQUETAS) ----------------
        let allLabels = [];
        
        onSnapshot(collection(db, "etiquetas"), (snapshot) => {
            allLabels = [];
            snapshot.forEach(doc => allLabels.push({ id: doc.id, ...doc.data() }));
            renderLabels();
        });

        document.getElementById('labelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isAdmin) return;
            await addDoc(collection(db, "etiquetas"), { 
                texto: document.getElementById('labelText').value,
                lat: parseFloat(document.getElementById('labelLat').value),
                lng: parseFloat(document.getElementById('labelLng').value)
            });
            e.target.reset();
        });

        window.deleteLabel = async function(id) {
            if(confirm("¿Eliminar este texto del mapa?")) {
                await deleteDoc(doc(db, "etiquetas", id));
            }
        };

        function renderLabels() {
            labelMarkers.forEach(m => map.removeLayer(m));
            labelMarkers = [];

            const adminList = document.getElementById('adminLabelList');
            if(adminList) adminList.innerHTML = '';

            allLabels.forEach(lbl => {
                const textIcon = L.divIcon({
                    className: 'map-text-label',
                    html: lbl.texto,
                    iconSize: [150, 20],
                    iconAnchor: [75, 10]
                });
                
                const marker = L.marker([lbl.lat, lbl.lng], { icon: textIcon, interactive: false }).addTo(map);
                labelMarkers.push(marker);

                if(isAdmin && adminList) {
                    adminList.innerHTML += `<li class="flex justify-between items-center bg-gray-50 p-2 rounded border">
                        ${lbl.texto} <button onclick="deleteLabel('${lbl.id}')" class="text-red-600 font-bold hover:text-red-800">X</button>
                    </li>`;
                }
            });
            adjustLabelsByZoom();
        }

        // ---------------- CATEGORÍAS ----------------
        onSnapshot(collection(db, "categorias"), (snapshot) => {
            allCategories = [];
            snapshot.forEach(doc => allCategories.push({ id: doc.id, nombre: doc.data().nombre }));
            allCategories.sort((a,b) => a.nombre.localeCompare(b.nombre));
            renderCategories();
            renderPlaces(); 
        });

        document.getElementById('catForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isAdmin) return;
            const input = document.getElementById('catName');
            await addDoc(collection(db, "categorias"), { nombre: input.value });
            input.value = "";
        });

        window.deleteCategory = async function(id) {
            if(confirm("¿Eliminar categoría?")) await deleteDoc(doc(db, "categorias", id));
        };

        function renderCategories() {
            const select = document.getElementById('placeCategory');
            select.innerHTML = '<option value="">Selecciona una categoría...</option>';
            const filterContainer = document.getElementById('filterContainer');
            filterContainer.innerHTML = `<span class="text-sm font-bold text-gray-500 mr-2">Explorar:</span>
                <button onclick="filterCategory('Todas')" class="${currentFilter === 'Todas' ? 'bg-[#2c4c3b] text-white' : 'bg-gray-200 text-gray-700'} px-3 py-1 rounded-full text-sm font-semibold transition">Todas</button>`;
            const adminList = document.getElementById('adminCatList');
            adminList.innerHTML = '';

            allCategories.forEach(c => {
                select.innerHTML += `<option value="${c.nombre}">${c.nombre}</option>`;
                const isSelected = currentFilter === c.nombre ? 'bg-[#2c4c3b] text-white' : 'bg-gray-200 text-gray-700 hover:bg-[#e8ecd7]';
                filterContainer.innerHTML += `<button onclick="filterCategory('${c.nombre}')" class="${isSelected} px-3 py-1 rounded-full text-sm font-semibold transition">${c.nombre}</button>`;
                if(isAdmin) {
                    adminList.innerHTML += `<li class="flex justify-between items-center bg-gray-50 p-2 rounded border">
                        ${c.nombre} <button onclick="deleteCategory('${c.id}')" class="text-red-600 font-bold hover:text-red-800">X</button>
                    </li>`;
                }
            });
        }

        window.filterCategory = function(cat) {
            currentFilter = cat;
            renderCategories(); 
            renderPlaces();
        };

        // ---------------- LUGARES ----------------
        document.getElementById('placeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isAdmin) return;
            const editId = document.getElementById('editPlaceId').value;
            const data = {
                nombre: document.getElementById('placeName').value,
                categoria: document.getElementById('placeCategory').value,
                descripcion: document.getElementById('placeDesc').value,
                imagen: document.getElementById('placeImage').value,
                lat: parseFloat(document.getElementById('placeLat').value),
                lng: parseFloat(document.getElementById('placeLng').value),
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "lugares", editId), data);
                } else {
                    data.fecha = new Date();
                    await addDoc(collection(db, "lugares"), data);
                }
                resetForm();
            } catch (error) { alert("Error: " + error.message); }
        });

        document.getElementById('btnCancelEdit').addEventListener('click', resetForm);

        function resetForm() {
            document.getElementById('placeForm').reset();
            document.getElementById('editPlaceId').value = "";
            document.getElementById('formTitle').innerText = "📍 Agregar Punto a la Guía";
            document.getElementById('btnSubmitForm').innerText = "Publicar Destino";
            document.getElementById('btnCancelEdit').classList.add('hidden');
        }

        onSnapshot(query(collection(db, "lugares"), orderBy("fecha", "desc")), (snapshot) => {
            allPlaces = [];
            snapshot.forEach(docSnap => allPlaces.push({ id: docSnap.id, ...docSnap.data() }));
            renderPlaces();
        });

        function renderPlaces() {
            const container = document.getElementById('placesContainer');
            container.innerHTML = '';
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];

            const filtered = currentFilter === 'Todas' ? allPlaces : allPlaces.filter(p => p.categoria === currentFilter);

            filtered.forEach((place) => {
                const marker = L.marker([place.lat, place.lng]).addTo(map)
                    .bindPopup(`<b>${place.nombre}</b><br><button onclick="traceRoute(${place.lat}, ${place.lng})" class="mt-1 text-xs bg-[#2c4c3b] text-white px-2 py-1 rounded w-full">Ir aquí</button>`);
                mapMarkers.push(marker);

                let distHtml = "";
                if (userLocation) {
                    const dLat = (place.lat - userLocation.lat) * Math.PI / 180;
                    const dLon = (place.lng - userLocation.lng) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(userLocation.lat * Math.PI / 180) * Math.cos(place.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                    const dist = (6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
                    distHtml = `<span class="bg-[#e8ecd7] text-[#2c4c3b] px-2 py-1 rounded text-xs font-bold border border-[#c1cc99]">A ${dist} km</span>`;
                }

                let adminBtns = isAdmin ? `
                    <div class="flex gap-2 mt-2 pt-2 border-t border-[#e5e0d8]">
                        <button onclick="editPlace('${place.id}')" class="text-blue-600 text-xs font-bold hover:underline">Editar</button>
                        <button onclick="deletePlace('${place.id}')" class="text-red-600 text-xs font-bold hover:underline">Eliminar</button>
                    </div>` : "";

                container.innerHTML += `
                    <article class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col border border-[#e5e0d8]">
                        <div class="relative h-48">
                            <img src="${place.imagen}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x200?text=Ray%C3%BCn+Ecorefugio'">
                            <button onclick="traceRoute(${place.lat}, ${place.lng})" class="absolute bottom-3 right-3 bg-[#2c4c3b] text-white px-3 py-2 rounded-lg text-sm font-bold shadow-lg hover:bg-[#1f362a] transition flex items-center gap-1">
                                🗺️ Trazar Ruta
                            </button>
                        </div>
                        <div class="p-5 flex-1 flex flex-col">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="text-[10px] uppercase tracking-wider font-bold text-gray-500">${place.categoria || 'General'}</span>
                                    <h3 class="text-lg font-bold text-[#2c4c3b] leading-tight">${place.nombre}</h3>
                                </div>
                                ${distHtml}
                            </div>
                            <p class="text-gray-600 text-sm mb-4 flex-1">${place.descripcion}</p>
                            ${adminBtns}
                        </div>
                    </article>`;
            });
        }

        window.editPlace = function(id) {
            const p = allPlaces.find(item => item.id === id);
            if (!p) return;
            document.getElementById('editPlaceId').value = p.id;
            document.getElementById('placeName').value = p.nombre;
            setTimeout(() => { document.getElementById('placeCategory').value = p.categoria; }, 50);
            document.getElementById('placeDesc').value = p.descripcion;
            document.getElementById('placeImage').value = p.imagen;
            document.getElementById('placeLat').value = p.lat;
            document.getElementById('placeLng').value = p.lng;
            document.getElementById('formTitle').innerText = "✏️ Editar Destino";
            document.getElementById('btnSubmitForm').innerText = "Guardar Cambios";
            document.getElementById('btnCancelEdit').classList.remove('hidden');
            window.scrollTo({ top: document.getElementById('adminPanel').offsetTop - 20, behavior: 'smooth' });
        };

        window.deletePlace = async function(id) {
            if (confirm("¿Eliminar este destino?")) await deleteDoc(doc(db, "lugares", id));
        };
    </script>
</body>
</html>
